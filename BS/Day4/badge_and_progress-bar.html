<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container mt-4">
        <h1>.badge .bg-success</h1>

        <span class="badge bg-primary">Badge</span>
        <span class="badge bg-success">Badge</span>

        <hr>

        <button class="btn btn-primary">Messages <span class="badge bg-danger">80</span></button>


        <hr>

        <h1 class="mt-3">.progress</h1>

        <div class="progress" style="height: 30px;">
            <div class="progress-bar" style="width: 25%;"></div>
        </div>
        <br>
        <div class="progress" style="height: 30px;">
            <div class="progress-bar bg-success" style="width: 55%;">55%</div>
        </div>

        <br>
        <div class="progress" style="height: 30px;">
            <div class="progress-bar bg-success progress-bar-striped" style="width: 45%;">45%</div>
        </div>

        <br>
        <div class="progress" style="height: 30px;">
            <div class="progress-bar bg-success progress-bar-striped progress-bar-animated" style="width: 45%;">45%
            </div>
        </div>

        <br>

        <div class="progress">
            <div class="progress-bar bg-success" style="width:40%">
                Free Space
            </div>
            <div class="progress-bar bg-warning" style="width:10%">
                Warning
            </div>
            <div class="progress-bar bg-danger" style="width:20%">
                Danger
            </div>
        </div>
    </div>


</body>

</html>
