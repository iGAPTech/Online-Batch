<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .login-box{
            width:30%;
            background-color: bisque;
            padding: 50px;
            margin:auto;
            margin-top: 90px;
            border-radius: 20px;
        }
        h1{
            text-align: center;
        }

        .login-form{
            padding: 15px;
            margin-top: 20px;
        }
        .mb{
            margin-bottom: 15px;
        }
        input{
            margin-top: 8px;
            padding: 12px;
            width: 95%;
            border-radius: 8px;
        }
        input:focus
        {
            border:1px solid #56c4f7;
            outline:1px solid #56c4f7;
        }
        .text-center{
            text-align: center;
        }

        .login-btn{
            padding: 8px;
            width: 90px;
            background-color: green;
            color: white;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>Login</h1>
        <hr>

        <form action="" class="login-form">
            <div class="mb">
                <label for="">Username</label><br>
                <input type="text" name="username" id="" placeholder="Enter Username" required>
            </div>

            <div class="mb">
                <label for="">Password</label><br>
                <input type="password" name="password" id="" placeholder="Enter Password" required>
            </div>

            <div class="mb text-center">
                <!-- <button type="reset" class="reset-btn">Reset</button> -->
                <button type="submit" class="login-btn">Login</button>
                <br><br>

                <a href="register.html">New User.? Click here to Register</a>
            </div>

        </form>
    </div>
</body>
</html>
