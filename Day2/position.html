<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        span{
            font-size: 30px;
        }
        #center{
            position: absolute;
            top: 50%;
            left: 48%;
        }
        #top{
            position: absolute;
            top:0;
            left:48%
        }
        #right{
            position: absolute;
            top:50%;
            right:5%
        }
        #bottom{
            position: absolute;
            bottom: 0;
            left:48%;
        }

        #left{
            position: absolute;
            left: 5%;
            top:50%
        }

        #LeftTop{
            position: absolute;
            left:5%;
            top:0
        }

        #RightTop{
            position: absolute;
            right: 5%;
            top:0
        }

        #RightBottom{
            position: absolute;
            right: 5%;
            bottom: 5%;
        }
        #LeftBottom{
            position: absolute;
            left:5%;
            bottom: 5%;
        }


    </style>
</head>
<body>
    <span id="top">TOP</span>
    <span id="center">Center</span>
    <span id="right">Right</span>
    <span id="bottom">Bottom</span>
    <span id="left">Left</span>

    <span id="LeftTop">Left-Top</span>
    <span id="RightTop">Right-Top</span>
    <span id="RightBottom">Right-Bottom</span>
    <span id="LeftBottom">Left-Bottom</span>
</body>
</html>
