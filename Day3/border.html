<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            margin: 5px;
        }
        .box{
            width: 150px;
            height: 100px;
            border:2px solid red;
            
        }
        .box1{
            width: 150px;
            height: 100px;
            border:1px dashed red;
        }
        .box2{
            width: 150px;
            height: 100px;
            border:1px dotted red;
        }
        .box3{
            width: 150px;
            height: 100px;
            /* border:1px double red; */
            /* border:1px groove red; */
            border:1px ridge red;
        }
    </style>
</head>
<body>
    <div class="box"></div>

    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box3"></div>
</body>
</html>
