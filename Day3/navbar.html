<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        section{
            height: 700px;
        }
        #home{
            background-color: #867171;
        }
        #about{
            background-color: #b0d493;
        }
        #services{
            background-color: #fdcfcf;
        }
        #contact{
            background-color: #afa169;
        }

        h1{
            text-align: center;
            margin:0;
            padding-top: 150px;
        }

    
        .menu{
            text-align: center;
            background-color: aqua;
            margin-top: -8px;
            padding: 30px;

            position: sticky;
            top:0;
        }
        .menu a{
            color: rgb(23, 6, 74);
            margin:5px;
            text-decoration: none;
            font-size: 24px;
        }

        .menu a:hover{
            color: red;
            border: 1px solid #867171;
            padding: 5px;
            background-color: antiquewhite;
            border-radius: 15px;

        }

        .btn{
            height: 64px;
            position: fixed;
            right:5%;
            bottom: 10%;
        }

        p{
            position: sticky;
            top:5%
        }
    </style>
</head>
<body>

    <div class="menu">
        <a href="#home">Home</a>
        <a href="#about">About</a> 
        <a href="#services">Services</a> 
        <a href="#contact">Contact</a> 
    </div>
    
    <section id="home">
            <h1>Home Section</h1>
            
            

    </section>

    <section id="about">
        <h1>About Section</h1>
            

    </section>

    <section id="services">
        <h1>Services Section</h1>
            
    </section>

    <section id="contact">
        <h1>Contact Section</h1>
            
    </section>

    <img src="../assets/img/whatsapp.png" alt="icon" class="btn">
</body>
</html>
